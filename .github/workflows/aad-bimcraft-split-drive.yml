name: AAD R02 — split verified archive for Drive
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aad-bimcraft-split-drive.yml'
permissions:
  contents: read
  actions: read
jobs:
  split:
    if: github.head_ref == 'research/aad11-bimcraft-preservation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download and verify original immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parts"
          curl --fail --location --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -o "$RUNNER_TEMP/original.zip" https://api.github.com/repos/FabinGurung/jp-drawing-coordination/actions/artifacts/15162666779/zip
          echo "fdbceebc6e8a1b230b8ae49695fe23ab48677b81e73e79efb4f21b2a78cd8be9  $RUNNER_TEMP/original.zip" | sha256sum -c -
          split -b 90000000 -d -a 2 "$RUNNER_TEMP/original.zip" "$RUNNER_TEMP/parts/bimcraft.part-"
          test "$(find "$RUNNER_TEMP/parts" -name 'bimcraft.part-*' | wc -l)" -eq 5
          cat "$RUNNER_TEMP"/parts/bimcraft.part-* | sha256sum
          (cd "$RUNNER_TEMP/parts" && sha256sum bimcraft.part-* > SHA256SUMS && cat SHA256SUMS)
          echo "Reconstruct by extracting each artifact ZIP, sorting part files 00–04, verifying SHA256SUMS, and concatenating them to original.zip. Original SHA-256 fdbceebc6e8a1b230b8ae49695fe23ab48677b81e73e79efb4f21b2a78cd8be9" > "$RUNNER_TEMP/parts/README.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: bimcraft-drive-part-00
          path: ${{ runner.temp }}/parts/bimcraft.part-00
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: bimcraft-drive-part-01
          path: ${{ runner.temp }}/parts/bimcraft.part-01
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: bimcraft-drive-part-02
          path: ${{ runner.temp }}/parts/bimcraft.part-02
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: bimcraft-drive-part-03
          path: ${{ runner.temp }}/parts/bimcraft.part-03
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: bimcraft-drive-part-04
          path: ${{ runner.temp }}/parts/bimcraft.part-04
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: bimcraft-drive-part-manifest
          path: |
            ${{ runner.temp }}/parts/SHA256SUMS
            ${{ runner.temp }}/parts/README.txt
          retention-days: 30
